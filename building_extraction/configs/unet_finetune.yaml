model:
  # "smp_unet" -> SMP U-Net with a strong ImageNet-pretrained encoder.
  # "dinov2_unet" -> DINOv2 ViT encoder + custom multi-scale decoder.
  arch: "smp_unet"
  encoder_name: "tu-convnext_base"   # strong + reasonable VRAM
  encoder_weights: "imagenet"
  num_classes: 1
  # Used only when arch == dinov2_unet:
  dino_model_name: "dinov2_vitb14"
  dino_freeze: true                  # set false to fine-tune the ViT (≫VRAM)

data:
  train_images: "data/train_images"
  train_masks: "data/pseudo_labels"
  val_images: "data/val_images"
  val_masks: "data/pseudo_labels_val"
  image_size: 512
  patch_size: 512

training:
  # epochs: 30
  epochs: 15  # 精修15epoch
  batch_size: 16
  num_workers: 4
  # lr: 5.0e-5         # was 1e-4 — too aggressive; loss flat-lined at 1.06
  lr: 2.0e-5  # 精修15epoch (must have decimal point — PyYAML treats `2e-5` as a string)
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_ratio: 0.1

loss:
  # Composite loss tuned for sharp building contours.
  # Note: with high positive ratio (~70% in dense Vaihingen tiles), boundary
  # weight 1.0 caused the model to learn only edge probabilities and collapse
  # interior. Keep it small until interior is solid, then ramp if needed.
  dice_weight: 1.0
  bce_weight: 1.0
  # boundary_weight: 0.3
  boundary_weight: 0.6 # 精修15epoch
  boundary_dilation: 3

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation_degrees: 15
  scale_range: [0.8, 1.2]
  brightness_limit: 0.1
  contrast_limit: 0.1

output:
  checkpoint_dir: "checkpoints/unet"
  log_dir: "logs/unet"
