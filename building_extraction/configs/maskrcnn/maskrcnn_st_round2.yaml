# Mask R-CNN self-training round 2: gentle correction after round 1's overshoot.
#
# Round 1 took out the big false positives (plazas as buildings) but went too
# far — it now under-predicts real buildings. Round 2 rebuilds recall:
#   * pseudo-labels generated from round 1 model with relaxed filters,
#     capturing more real-but-imperfect buildings (round 1 won't hallucinate
#     plazas anymore even at lower score threshold)
#   * lr halved (5e-4 vs round 1's 1.25e-3) — gentler nudge
#   * 3 epochs (vs 6) — less aggressive shift
#   * warm-start from round 1 best, NOT from baseline — keep what round 1 did right

model:
  variant: "v2"
  num_classes: 1
  pretrained: false
  trainable_backbone_layers: 3

data:
  train_ann_file: "annotations/vaihingen_train_coco.json"
  train_image_dir: "data/train_images"
  val_ann_file: "annotations/vaihingen_val_coco.json"
  val_image_dir: "data/val_images"
  extra_train:
    - ann_file: "data/potsdam_maskrcnn_pseudo_r2_coco.json"
      image_dir: "data/potsdam_maskrcnn_pseudo_r2_images"

training:
  epochs: 3
  batch_size: 4
  num_workers: 4
  lr: 5.0e-4
  momentum: 0.9
  weight_decay: 1.0e-4
  warmup_iters: 100
  warmup_factor: 0.01
  lr_milestones: [2]
  lr_gamma: 0.1
  grad_clip: 35.0

inference:
  score_thresh: 0.5
  nms_iou: 0.5
  max_detections: 200

output:
  checkpoint_dir: "checkpoints/maskrcnn_st_r2"
  log_dir: "logs/maskrcnn_st_r2"
